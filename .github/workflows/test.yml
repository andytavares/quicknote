name: test
on: [push, pull_request]
jobs:
  test:
    # Hosted runners are macOS 26: scripts/test.sh builds the app tests here and runs them only on macOS 27.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: scripts/lint.sh
      - run: scripts/test.sh
