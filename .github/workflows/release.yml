name: release
# Every push to main that passes the test workflow ships the next patch version.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
concurrency: release
permissions:
  contents: write
jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      NOTARY_PROFILE: quicknote-notary
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Pick the next patch version
        run: |
          latest=$(gh release view --json tagName --jq .tagName | sed 's/^v//')
          IFS=. read -r major minor patch <<< "$latest"
          version="$major.$minor.$((patch + 1))"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_DOWNLOAD_URL_PREFIX=https://github.com/${{ github.repository }}/releases/download/v$version/" >> "$GITHUB_ENV"
      - name: Install the signing certificate and notary credentials
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$DEVELOPMENT_TEAM" --password "$APPLE_APP_PASSWORD"
      - run: brew install xcodegen
      - name: Fetch Sparkle's tools
        run: |
          xcodegen generate --quiet
          xcodebuild -resolvePackageDependencies -project Quicknote.xcodeproj -scheme Quicknote \
            -clonedSourcePackagesDirPath build/SourcePackages
      - run: scripts/release.sh "$VERSION"
      - name: Publish the GitHub release
        run: |
          gh release create "v$VERSION" "releases/Quicknote-$VERSION.dmg" releases/appcast.xml \
            --target "${{ github.event.workflow_run.head_sha }}" --title "Quicknote $VERSION" --generate-notes
